# BuildBuddy open-source on-prem config.
# Mounted at /config.yaml in the buildbuddy container (see docker-compose.buildbuddy.yml).
# Docs: https://www.buildbuddy.io/docs/config

app:
  # Public URL used in build links (host port of the UI)
  build_buddy_url: "http://localhost:8081"

database:
  # SQLite database for invocation metadata
  data_source: "sqlite3:///data/buildbuddy/buildbuddy.db"

storage:
  # Keep build event data for 30 days (0 disables expiry)
  ttl_seconds: 2592000
  disk:
    root_directory: "/data/buildbuddy/storage"

cache:
  # Remote cache size limit (10 GB)
  max_size_bytes: 10737418240
  disk:
    root_directory: "/data/buildbuddy/cache"

remote_execution:
  enable_remote_exec: true
  # Task queue for executors (service name from docker-compose.buildbuddy.yml)
  redis_target: "redis:6379"
